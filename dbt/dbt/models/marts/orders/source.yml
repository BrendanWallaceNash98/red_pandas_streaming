version: '2'

models:
  - name: fct_orders
    description: One row per order with order level metrics
    columns:
      - name: order_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: distinct_products
        tests:
          - not_null
      - name: total_items
        tests:
          - not_null
      - name: order_total
        tests:
          - not_null

  - name: fct_order_lines
    description: One row per order line item
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: product_name
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: line_total
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
