version: "3.8"

networks:
  data-pipeline:
    driver: bridge

volumes:
  postgres_data:
  duckdb_data:

services:
  # ─── PostgreSQL (operational OLTP database) ───
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eccom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-pipeline
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Python Order Generator (produces JSON files) ───
  python-generator:
    build:
      context: ./python-generator
      dockerfile: Dockerfile
    container_name: order-generator
    environment:
      GO_INGESTER_URL: http://go-ingester:8086/api/orders
      GENERATE_INTERVAL: 5
    depends_on:
      go-ingester:
        condition: service_healthy
    volumes:
      - ./python-generator:/app
    networks:
      - data-pipeline
    restart: unless-stopped

  # ─── Go Ingestor (receives from Python, writes to Postgres + Redpanda) ───
  go-ingester:
    build:
      context: ./go-ingester
      dockerfile: Dockerfile
    container_name: go-ingester
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/eccom_db
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./go-ingester:/app
    networks:
      - data-pipeline
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redpanda (CDC + event streaming) ───
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "9644:9644"
    networks:
      - data-pipeline
    healthcheck:
      test: ["CMD-SHELL", "rpk topic list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Debezium CDC (Postgres → Redpanda) ───
  debezium:
    image: debezium/connect:2.4
    container_name: debezium
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      OFFSET_FLUSH_INTERVAL_MS: 1000
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./debezium-connector-config.json:/etc/debezium/connector-config.json
    networks:
      - data-pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Debezium Init (auto-deploy connector on startup) ───
  debezium-init:
    image: curlimages/curl:latest
    container_name: debezium-init
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium-connector-config.json:/config.json
    networks:
      - data-pipeline
    command: >
      sh -c "
        echo 'Waiting for Debezium...' &&
        until curl -s http://debezium:8083/ | grep -q kafka; do sleep 2; done &&
        echo 'Debezium is ready, deploying connector...' &&
        curl -i -X POST -H 'Content-Type: application/json' \\
          -d @/config.json \\
          http://debezium:8083/connectors &&
        echo 'Connector deployed.'
      "
    restart: "no"

  # ─── DuckDB Consumer (reads Redpanda, writes DuckDB) ───
  duckdb-consumer:
    build:
      context: ./duckdb-consumer
      dockerfile: Dockerfile
    container_name: duckdb-consumer
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: eccom_db.public.orders
      DUCKDB_PATH: /data/orders.db
      SCHEMA_REGISTRY_URL: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - duckdb_data:/data
    networks:
      - data-pipeline
    restart: unless-stopped

  # ─── DuckDB API (exposes DuckDB to frontend via HTTP) ───
  duckdb-api:
    build:
      context: ./duckdb-api
      dockerfile: Dockerfile
    container_name: duckdb-api
    environment:
      DUCKDB_PATH: /data/orders.db
      PORT: 8090
    ports:
      - "8090:8090"
    volumes:
      - duckdb_data:/data
    depends_on:
      duckdb-consumer:
        condition: service_healthy
    networks:
      - data-pipeline
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── DBT (transformations on PostgreSQL) ───
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt
    volumes:
      - ./dbt/dbt:/dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /dbt
    networks:
      - data-pipeline
    command: ["dbt", "run"]

  # ─── Frontend (queries DuckDB API for analytics) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      DUCKDB_API_URL: http://duckdb-api:8090
    ports:
      - "3000:3000"
    depends_on:
      duckdb-api:
        condition: service_healthy
    networks:
      - data-pipeline
    restart: unless-stopped
